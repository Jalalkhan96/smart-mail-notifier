<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Smart Mail Notifier</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="../icons/icon32.png" alt="" width="18" height="18" />
      <span class="eyebrow">Smart Mail Notifier</span>
    </div>
    <div class="topbar-actions">
      <button id="refreshBtn" class="icon-btn" title="Refresh now" aria-label="Refresh now">
        <svg viewBox="0 0 20 20" fill="none"><path d="M4 10a6 6 0 0 1 10.2-4.3M16 10a6 6 0 0 1-10.2 4.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M14 3.5V6a.6.6 0 0 1-.6.6h-2.5M6 16.5V14a.6.6 0 0 1 .6-.6h2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="optionsBtn" class="icon-btn" title="Settings" aria-label="Open settings">
        <svg viewBox="0 0 20 20" fill="none"><path d="M10 12.6a2.6 2.6 0 1 0 0-5.2 2.6 2.6 0 0 0 0 5.2Z" stroke="currentColor" stroke-width="1.5"/><path d="M16.2 12.3c.1-.3.1-.6 0-.9l1-1.5-1.2-2-1.8.4a4.9 4.9 0 0 0-.8-.5l-.3-1.8H10.9l-.3 1.8c-.3.1-.6.3-.8.5l-1.8-.4-1.2 2 1 1.5a3.6 3.6 0 0 0 0 .9l-1 1.5 1.2 2 1.8-.4c.2.2.5.4.8.5l.3 1.8h2.2l.3-1.8c.3-.1.6-.3.8-.5l1.8.4 1.2-2-1-1.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <section id="hero" class="hero">
    <div class="hero-count">
      <span id="countNumber">0</span>
    </div>
    <div class="hero-meta">
      <p id="countLabel" class="hero-label">new emails today</p>
      <p id="accountLine" class="account-line"></p>
    </div>
    <span id="unreadPill" class="pill hidden"></span>
  </section>

  <div id="accountWarning" class="account-warning hidden"></div>

  <main id="listWrap" class="list-wrap">
    <ul id="emailList" class="email-list"></ul>

    <div id="emptyState" class="state-card hidden">
      <div class="stamp-frame">
        <svg viewBox="0 0 40 40" fill="none"><path d="M8 13.5 20 22l12-8.5M8 13.5v13A1.5 1.5 0 0 0 9.5 28h21a1.5 1.5 0 0 0 1.5-1.5v-13M8 13.5A1.5 1.5 0 0 1 9.5 12h21a1.5 1.5 0 0 1 1.5 1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <p class="state-title">You're all caught up</p>
      <p class="state-sub">No new mail since midnight.</p>
    </div>

    <div id="loadingState" class="state-card hidden">
      <div class="spinner"></div>
      <p class="state-sub">Checking your inbox…</p>
    </div>

    <div id="errorState" class="state-card hidden">
      <p class="state-title">Something went wrong</p>
      <p id="errorMessage" class="state-sub"></p>
      <button id="retryBtn" class="btn btn-accent">Retry</button>
    </div>

    <div id="signedOutState" class="state-card hidden">
      <div class="stamp-frame">
        <svg viewBox="0 0 40 40" fill="none"><path d="M8 13.5 20 22l12-8.5M8 13.5v13A1.5 1.5 0 0 0 9.5 28h21a1.5 1.5 0 0 0 1.5-1.5v-13M8 13.5A1.5 1.5 0 0 1 9.5 12h21a1.5 1.5 0 0 1 1.5 1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <p class="state-title">Connect your Gmail</p>
      <p id="signedOutSub" class="state-sub">Uses the Gmail you're already signed into in Chrome — nothing leaves your browser.</p>
      <button id="signInBtn" class="btn btn-primary">Sign in with Google</button>
    </div>
  </main>

  <footer class="footer">
    <button id="refreshFooterBtn" class="btn btn-ghost">Refresh now</button>
    <button id="optionsFooterBtn" class="link-btn">Settings</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
